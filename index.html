<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="RoboExpand — A Real2Sim2Real Data Engine with Agentic Reconstruction and Multi-View Video Generation. Project page coming soon.">
    <meta name="theme-color" content="#f7f8fa">
    <title>RoboExpand</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172c43;
        background: #f7f8fa;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 280px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 64px 24px;
        background: radial-gradient(ellipse at 50% 15%, #eaf0f7 0%, transparent 60%);
      }

      main {
        width: 100%;
        max-width: 760px;
        text-align: center;
      }

      main::before {
        content: "";
        display: block;
        width: 48px;
        height: 4px;
        margin: 0 auto 36px;
        border-radius: 2px;
        background: #557b9f;
      }

      h1 {
        margin: 0;
        font-size: clamp(44px, 9vw, 88px);
        line-height: 1.08;
        font-weight: 650;
        letter-spacing: -0.055em;
      }

      .subtitle {
        max-width: 670px;
        margin: 28px auto 0;
        font-size: clamp(18px, 2.5vw, 24px);
        line-height: 1.55;
        font-weight: 400;
        color: #41566c;
        text-wrap: balance;
      }

      .status {
        margin: 52px 0 0;
        font-size: 15px;
        line-height: 1.6;
        color: #637283;
      }

      @media (max-width: 480px) {
        body {
          padding: 48px 24px;
        }

        main::before {
          margin-bottom: 28px;
        }

        .subtitle {
          margin-top: 22px;
        }

        .status {
          margin-top: 40px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RoboExpand</h1>
      <p class="subtitle">A Real2Sim2Real Data Engine with Agentic Reconstruction and Multi-View Video Generation</p>
      <p class="status">Project page coming soon.</p>
    </main>
  </body>
</html>
